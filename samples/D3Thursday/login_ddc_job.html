<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação Local</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* FUNDO TRANSPARENTE */
        body { background-color: transparent; font-family: "Segoe UI", sans-serif; height: 100vh; overflow: hidden; margin: 0; }
        
        /* ÁREA DE LOGIN (Flutuante e Transparente) */
        #login-screen {
            display: flex; justify-content: center; align-items: center; height: 100%; width: 100%;
        }
        
        /* O "Card" aqui é minimalista para encaixar no seu retângulo do Figma */
        .login-box {
            width: 320px; 
            /* Se quiser fundo branco no input container, descomente abaixo */
            /* background: rgba(255,255,255,0.9); padding: 20px; border-radius: 8px; */
            text-align: left;
        }

        .lbl-instrucao { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 5px; display: block; }
        .escola-selecionada { font-size: 12px; color: #555; margin-bottom: 10px; font-style: italic; }

        input.form-control {
            border: 2px solid #ccc; border-radius: 6px; padding: 12px; font-size: 16px;
        }
        input.form-control:focus { border-color: #0F62AC; box-shadow: none; }

        .btn-entrar {
            width: 100%; margin-top: 10px; padding: 12px; background-color: #0F62AC; 
            color: white; font-weight: bold; border: none; border-radius: 6px;
        }
        .btn-entrar:hover { background-color: #0a4d8c; }

        /* TELA DE DADOS (Fundo Branco para leitura) */
        #data-screen { display: none; height: 100%; flex-direction: column; background: white; padding: 20px; }
        
        /* MODAL DE CÓPIA */
        .manual-modal {
            display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6); align-items: center; justify-content: center;
        }
        .manual-modal-content {
            background-color: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .manual-textarea {
            width: 100%; height: 200px; margin: 15px 0; font-family: monospace; font-size: 11px;
            background: #f8f9fa; border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <div id="infoEscola" class="escola-selecionada">Aguardando seleção na lista...</div>
            
            <label class="lbl-instrucao">SENHA DE ACESSO</label>
            <input type="password" id="txtSenha" class="form-control" placeholder="Digite a senha" disabled>
            
            <button id="btnValidar" class="btn-entrar" onclick="validarSenha()" disabled>ENTRAR</button>
            
            <div id="msgErro" class="text-danger mt-2 small" style="display:none; font-weight:bold;"></div>
        </div>
    </div>

    <div id="data-screen">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 style="color:#0F62AC; margin:0">Dados da Escola</h5>
            <div>
                <button class="btn btn-primary btn-sm me-1" onclick="abrirModalCopia()">
                    <i class="fa-solid fa-copy"></i> Copiar
                </button>
                <button class="btn btn-secondary btn-sm me-1" onclick="toggleFullScreen()">
                    <i class="fa-solid fa-expand"></i> Tela Cheia
                </button>
                <button class="btn btn-outline-danger btn-sm" onclick="logout()">Sair</button>
            </div>
        </div>
        <div style="flex:1; overflow:auto;">
            <table id="tabelaPrincipal" class="table table-hover w-100" style="width:100%"></table>
        </div>
    </div>

    <div id="modalCopia" class="manual-modal">
        <div class="manual-modal-content">
            <h5 style="color:#0F62AC">Dados para Excel</h5>
            <p class="small text-muted">Pressione <b>Ctrl+C</b> para copiar e cole no Excel.</p>
            <textarea id="areaTransferencia" class="manual-textarea" readonly></textarea>
            <button class="btn btn-secondary btn-sm" onclick="fecharModal()">Fechar</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

    <script>
        var dadosSAS = [];
        var colunasSAS = [];
        var senhaCorreta = ""; // Armazena a senha que veio do SAS
        var tabelaInstancia = null;

        // 1. OUVINTE DO SAS (Carrega os dados filtrados pela lista)
        function receberDados(event) {
            if (event.data && event.data.hasOwnProperty("data")) {
                dadosSAS = event.data.data;
                colunasSAS = event.data.columns;
                
                verificarEstado();
            }
        }

        function verificarEstado() {
            var inputSenha = document.getElementById("txtSenha");
            var btn = document.getElementById("btnValidar");
            var info = document.getElementById("infoEscola");

            // Se vieram muitos dados, significa que não filtrou direito
            if (dadosSAS.length > 5000) {
                info.innerText = "Muitos dados (" + dadosSAS.length + "). Selecione UMA escola na lista.";
                info.style.color = "orange";
                inputSenha.disabled = true;
                btn.disabled = true;
                return;
            }

            if (dadosSAS.length === 0) {
                info.innerText = "Nenhum dado. Selecione uma escola.";
                inputSenha.disabled = true;
                btn.disabled = true;
                return;
            }

            // PEGA A SENHA CORRETA (Coluna 1) DA PRIMEIRA LINHA
            // Assume que todas as linhas filtradas são da mesma escola/senha
            var loginAtual = dadosSAS[0][0]; 
            senhaCorreta = String(dadosSAS[0][1]).trim(); 

            info.innerText = "Escola Selecionada: " + loginAtual;
            info.style.color = "#0F62AC";
            
            inputSenha.disabled = false;
            btn.disabled = false;
        }

        // 2. VALIDAÇÃO LOCAL (Sem Job)
        function validarSenha() {
            var digitado = document.getElementById("txtSenha").value.trim();
            var erro = document.getElementById("msgErro");
            
            erro.style.display = "none";

            if (digitado === senhaCorreta) {
                // SUCESSO
                mostrarTabela();
            } else {
                // ERRO
                erro.innerText = "Senha incorreta.";
                erro.style.display = "block";
            }
        }

        // 3. MOSTRAR TABELA
        function mostrarTabela() {
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("data-screen").style.display = "flex";

            // Colunas: Oculta Senha (index 1)
            var cols = colunasSAS.map(function(c, i) {
                return { title: c.label, visible: i !== 1 };
            });

            if (tabelaInstancia) { tabelaInstancia.destroy(); $('#tabelaPrincipal').empty(); }

            tabelaInstancia = $('#tabelaPrincipal').DataTable({
                data: dadosSAS,
                columns: cols,
                language: { url: "https://cdn.datatables.net/plug-ins/1.13.6/i18n/pt-BR.json" },
                pageLength: 10,
                scrollX: true,
                dom: 'frtip'
            });
        }

        // 4. UTILITÁRIOS (Cópia, Tela Cheia, Logout)
        function abrirModalCopia() {
            var texto = "";
            var titulos = [];
            colunasSAS.forEach((c, i) => { if (i !== 1) titulos.push(c.label); });
            texto += titulos.join("\t") + "\n";

            dadosSAS.forEach(row => {
                var linha = [];
                row.forEach((cell, i) => {
                    if (i !== 1) linha.push(String(cell || "").replace(/(\r\n|\n|\r)/gm, " "));
                });
                texto += linha.join("\t") + "\n";
            });

            document.getElementById("areaTransferencia").value = texto;
            document.getElementById("modalCopia").style.display = "flex";
            document.getElementById("areaTransferencia").select();
        }

        function fecharModal() {
            document.getElementById("modalCopia").style.display = "none";
        }

        function toggleFullScreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e => alert("Bloqueado"));
            else document.exitFullscreen();
        }

        function logout() {
            document.getElementById("data-screen").style.display = "none";
            document.getElementById("login-screen").style.display = "flex";
            document.getElementById("txtSenha").value = "";
            if (document.fullscreenElement) document.exitFullscreen();
        }

        // INICIALIZAÇÃO
        if (window.addEventListener) window.addEventListener("message", receberDados, false);
        else window.attachEvent("onmessage", receberDados);

    </script>
</body>
</html>
