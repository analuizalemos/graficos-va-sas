<!-- 
  CONFIRMAÇÃO DE REQUISITOS ATUALIZADOS:
  1. Cores de Severidade: Implementado gradiente de 1 (Baixo) a 5 (Crítico) com hexadecimais específicos.
  2. Layout de Lista: Escolas empilhadas verticalmente (1 por linha no container principal).
  3. Alertas Dinâmicos: O grid de alertas se ajusta à largura da tela (auto-fill), cabendo mais itens por linha.
  4. Ordenação: Escolas ordenadas por severidade/total (as críticas aparecem primeiro).
-->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Risco Escolar - SAS VA</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* --- CORES DE SEVERIDADE (1 a 5) --- */
            --sev-1: #F7D447; /* Baixo */
            --sev-2: #CEA606; /* Normal */
            --sev-3: #ED7331; /* Médio */
            --sev-4: #EE0505; /* Alto */
            --sev-5: #910303; /* Crítico */
            
            --sev-0: #F5F5F5; /* Inativo/Sem Dados */
            --sev-0-text: #BDBDBD;

            /* Cores Gerais */
            --bg-body: #FAFAFA;
            --bg-card: #FFFFFF;
            --text-primary: #212121;
            --text-secondary: #757575;
            --text-white: #FFFFFF;
            
            /* UI */
            --card-radius: 8px;
            --alert-radius: 6px;
            --spacing-sm: 8px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            
            --shadow-card: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            margin: 0;
            padding: var(--spacing-md);
            overflow-x: hidden;
        }

        /* Container: Agora é uma lista vertical única */
        #app-container {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            max-width: 1200px; /* Limite para telas ultra-wide */
            margin: 0 auto;
        }

        /* --- Card da Escola --- */
        .school-card {
            background-color: var(--bg-card);
            border-radius: var(--card-radius);
            box-shadow: var(--shadow-card);
            padding: var(--spacing-md) var(--spacing-lg);
            display: flex;
            flex-direction: column;
            border-left: 6px solid transparent; /* Indicador lateral de risco */
            transition: transform 0.2s ease;
        }

        /* Borda lateral colorida baseada no risco máximo da escola (aplicado via JS) */
        .school-card.risk-5 { border-left-color: var(--sev-5); }
        .school-card.risk-4 { border-left-color: var(--sev-4); }
        .school-card.risk-3 { border-left-color: var(--sev-3); }
        .school-card.risk-2 { border-left-color: var(--sev-2); }
        .school-card.risk-1 { border-left-color: var(--sev-1); }
        .school-card.risk-0 { border-left-color: #DDD; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-md);
            border-bottom: 1px solid #EEE;
            padding-bottom: var(--spacing-sm);
        }

        .school-name {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
            color: var(--text-primary);
        }

        .school-meta {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        /* Badge do Total */
        .total-badge {
            background-color: #E0E0E0;
            color: #424242;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        /* Se houver alertas críticos, o badge do total fica vermelho */
        .total-badge.critical {
            background-color: var(--sev-4);
            color: white;
            box-shadow: 0 2px 8px rgba(238, 5, 5, 0.4);
        }

        /* --- Grid de Alertas Dinâmico --- */
        .alerts-grid {
            display: grid;
            /* Auto-fill: cria tantas colunas quantas couberem (min 130px) */
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: var(--spacing-sm);
        }

        /* Card Individual de Alerta */
        .alert-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            border-radius: var(--alert-radius);
            text-align: center;
            min-height: 90px;
            border: 1px solid transparent;
            position: relative;
        }

        .alert-icon { font-size: 1.5rem; margin-bottom: 6px; }
        .alert-label { font-size: 0.75rem; font-weight: 500; line-height: 1.2; }
        .alert-val { font-size: 0.7rem; margin-top: 4px; opacity: 0.8; font-weight: bold; }

        /* --- Estilização por Nível (1-5) --- */
        
        /* Nível 0 (Inativo) */
        .alert-item.sev-0 {
            background-color: var(--bg-card);
            border-color: #EEE;
            color: var(--sev-0-text);
        }

        /* Nível 1 (Baixo) - #F7D447 - Texto escuro pois fundo é claro */
        .alert-item.sev-1 {
            background-color: var(--sev-1);
            color: #333; 
            border-color: #EBC636;
        }

        /* Nível 2 (Normal) - #CEA606 - Texto branco ou escuro? Vamos de branco p/ contraste melhor no escuro, mas amarelo pede teste. Vamos usar branco. */
        .alert-item.sev-2 {
            background-color: var(--sev-2);
            color: white;
        }

        /* Nível 3 (Médio) - #ED7331 */
        .alert-item.sev-3 {
            background-color: var(--sev-3);
            color: white;
        }

        /* Nível 4 (Alto) - #EE0505 */
        .alert-item.sev-4 {
            background-color: var(--sev-4);
            color: white;
            font-weight: 500;
        }

        /* Nível 5 (Crítico) - #910303 */
        .alert-item.sev-5 {
            background-color: var(--sev-5);
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(145, 3, 3, 0.3);
            animation: pulse-critical 2s infinite;
        }

        @keyframes pulse-critical {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        .expand-control { text-align: center; margin-top: 10px; }
        .btn-expand { 
            background: none; border: none; color: #1976D2; cursor: pointer; 
            font-weight: 500; padding: 5px 10px;
        }
        .btn-expand:hover { background-color: #E3F2FD; border-radius: 4px; }
        .hidden-alerts { display: none; }
        
        .loading { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="loading">
            <i class="fas fa-circle-notch fa-spin"></i> Inicializando painel...
        </div>
    </div>

    <!-- Utilitários SAS -->
    <script src="../../util/messagingUtil.js"></script>
    <script src="../../util/contentUtil.js"></script>

    <script>
        const MAX_VISIBLE_ALERTS = 8; // Aumentei pois o layout agora é wide
        
        // --- DADOS DE EXEMPLO ATUALIZADOS (0 a 5) ---
        const SAMPLE_DATA = {
            version: "1",
            rowCount: 5,
            availableRowCount: 5,
            columns: [
                { name: "bi1", label: "Escola", type: "string" },
                { name: "bi2", label: "Score Total", type: "number" },
                { name: "bi3", label: "Evasão", type: "number" },
                { name: "bi4", label: "Frequência", type: "number" },
                { name: "bi5", label: "Notas", type: "number" },
                { name: "bi6", label: "Infraestrutura", type: "number" },
                { name: "bi7", label: "Professores", type: "number" },
                { name: "bi8", label: "Merenda", type: "number" },
                { name: "bi9", label: "Segurança", type: "number" }
            ],
            data: [
                ["Colégio Estadual Crítico", 95, 5, 5, 4, 1, 0, 3, 5],
                ["Escola Municipal Média", 45, 3, 2, 0, 3, 1, 2, 0],
                ["Instituto Modelo (Baixo Risco)", 10, 1, 1, 0, 0, 0, 0, 0],
                ["Centro Educacional Alto Risco", 80, 4, 4, 5, 2, 1, 1, 0],
                ["Escola Padrão", 25, 2, 0, 0, 2, 0, 0, 1]
            ]
        };

        function processData(message) {
            if (!message || !message.data) return [];
            const columns = message.columns;
            const rows = message.data;

            // Mapeia linhas
            let schools = rows.map(row => {
                const alerts = [];
                let maxSeverity = 0; // Para colorir a borda do card

                // Colunas 2 em diante são alertas
                for (let i = 2; i < columns.length; i++) {
                    // Garante que é int (0 a 5)
                    let val = parseInt(row[i]) || 0;
                    if (val > 5) val = 5; // Cap no 5
                    if (val < 0) val = 0;

                    if (val > maxSeverity) maxSeverity = val;

                    alerts.push({
                        label: columns[i].label,
                        value: val
                    });
                }

                return {
                    schoolName: row[0],
                    totalScore: parseFloat(row[1] || 0),
                    maxSeverity: maxSeverity,
                    alerts: alerts
                };
            });

            // --- ORDENAÇÃO (Requisito: Comece mostrando onde tem alerta) ---
            // Ordena primeiro por Score Total (Decrescente), depois por Max Severidade
            schools.sort((a, b) => b.totalScore - a.totalScore);

            return schools;
        }

        function renderCards(schoolData) {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (schoolData.length === 0) {
                container.innerHTML = '<div class="loading">Sem dados.</div>';
                return;
            }

            schoolData.forEach(school => {
                const card = document.createElement('div');
                // Adiciona classe de risco (risk-5, risk-4...) para a borda lateral
                card.className = `school-card risk-${school.maxSeverity}`;

                // --- Header ---
                const header = document.createElement('div');
                header.className = 'card-header';
                
                const info = document.createElement('div');
                info.innerHTML = `
                    <h3 class="school-name">${school.schoolName}</h3>
                    <div class="school-meta">Severidade Máxima: Nível ${school.maxSeverity}</div>
                `;

                // Badge Total
                const badge = document.createElement('div');
                // Se score > 50 ou risco > 3, destaca o badge
                const isCritical = school.totalScore > 50 || school.maxSeverity >= 4;
                badge.className = `total-badge ${isCritical ? 'critical' : ''}`;
                badge.innerHTML = `<i class="fas fa-chart-line"></i> ${school.totalScore}`;

                header.appendChild(info);
                header.appendChild(badge);

                // --- Grid ---
                const grid = document.createElement('div');
                grid.className = 'alerts-grid';

                // Ordena alertas INTERNAMENTE também? 
                // Opcional: mostrar alertas mais graves primeiro dentro do card
                const sortedAlerts = [...school.alerts].sort((a, b) => b.value - a.value);

                sortedAlerts.forEach((alert, idx) => {
                    const item = document.createElement('div');
                    item.className = `alert-item sev-${alert.value}`;
                    
                    if (idx >= MAX_VISIBLE_ALERTS) {
                        item.classList.add('hidden-alerts');
                        item.dataset.hidden = "true";
                    }

                    // Ícones dinâmicos baseados no nível
                    let iconClass = 'fa-check-circle'; // 0
                    if (alert.value === 1) iconClass = 'fa-info-circle';
                    if (alert.value === 2) iconClass = 'fa-exclamation-circle';
                    if (alert.value === 3) iconClass = 'fa-exclamation-triangle';
                    if (alert.value === 4) iconClass = 'fa-radiation';
                    if (alert.value === 5) iconClass = 'fa-skull-crossbones';

                    item.innerHTML = `
                        <i class="alert-icon fas ${iconClass}"></i>
                        <span class="alert-label">${alert.label}</span>
                        ${alert.value > 0 ? `<span class="alert-val">Nível ${alert.value}</span>` : ''}
                    `;
                    
                    // Tooltip simples
                    item.title = `${alert.label}: Nível ${alert.value}`;
                    grid.appendChild(item);
                });

                card.appendChild(header);
                card.appendChild(grid);

                // Botão Ver Mais
                if (sortedAlerts.length > MAX_VISIBLE_ALERTS) {
                    const btnDiv = document.createElement('div');
                    btnDiv.className = 'expand-control';
                    const btn = document.createElement('button');
                    btn.className = 'btn-expand';
                    btn.innerText = `Ver mais detalhes (${sortedAlerts.length - MAX_VISIBLE_ALERTS})`;
                    
                    btn.onclick = () => {
                        const hiddens = card.querySelectorAll('.hidden-alerts');
                        const isClosed = btn.innerText.includes('Ver mais');
                        hiddens.forEach(el => el.style.display = isClosed ? 'flex' : 'none');
                        btn.innerText = isClosed ? 'Recolher' : `Ver mais detalhes (${sortedAlerts.length - MAX_VISIBLE_ALERTS})`;
                    };
                    btnDiv.appendChild(btn);
                    card.appendChild(btnDiv);
                }

                container.appendChild(card);
            });
        }

        function onDataReceived(message) {
            const data = processData(message);
            renderCards(data);
        }

        // --- Fallback Init ---
        if (!window.va) window.va = {};
        if (!window.va.messagingUtil) {
            window.va.messagingUtil = {
                setOnDataReceivedCallback: (cb) => {
                    setTimeout(() => cb(SAMPLE_DATA), 500);
                }
            };
        }
        if (window.va.messagingUtil) {
            window.va.messagingUtil.setOnDataReceivedCallback(onDataReceived);
        }
    </script>
</body>
</html>
