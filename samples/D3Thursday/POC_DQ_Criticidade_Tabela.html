<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Alertas - SAS DDC</title>
    
    <!-- Fontes Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* 1. CRÍTICO (Vinho/Vermelho Escuro) */
            --color-critical: #8B0000; 
            --bg-critical: #FFF0F0;
            
            /* 2. ALTO (Vermelho Vivo) */
            --color-high: #DC143C;
            --bg-high: #FFF5F5;

            /* 3. MODERADO (Laranja/Âmbar) */
            --color-moderate: #FF8C00; 
            --bg-moderate: #FFF8E1;

            /* 4. BAIXO (Amarelo/Dourado) */
            --color-low: #DAA520; 
            --bg-low: #FFFFF0;

            --bg-body: #fdfdfd;
            --text-main: #333;
            --radius-card: 6px;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 10px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; 
        }

        /* Container Grid - MODIFICADO PARA FORÇAR LADO A LADO */
        .kanban-container {
            display: grid;
            /* Garante 4 colunas com largura mínima de 220px cada */
            grid-template-columns: repeat(4, minmax(220px, 1fr));
            gap: 16px;
            flex: 1;
            overflow-y: hidden; /* Scroll vertical interno das colunas */
            overflow-x: auto;   /* Scroll horizontal apenas se necessário */
            min-height: 0;
            padding-top: 10px;
            padding-bottom: 5px; /* Espaço para scrollbar horizontal se aparecer */
        }

        /* Coluna */
        .kanban-column {
            background: #fff;
            border: 1px solid #eee;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            height: 100%;
            min-width: 0; /* Previne overflow flexbox */
        }

        /* Header */
        .column-header {
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            border-radius: 8px 8px 0 0;
            white-space: nowrap; /* Título não quebra linha */
        }

        .title-wrapper { display: flex; align-items: center; gap: 8px; }

        .badge-count {
            background: rgba(255,255,255,0.8);
            border-radius: 12px;
            padding: 2px 10px;
            font-size: 0.8rem;
            font-weight: bold;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* Body */
        .column-body {
            padding: 12px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Custom Scrollbar para ficar mais elegante */
        .column-body::-webkit-scrollbar { width: 6px; }
        .column-body::-webkit-scrollbar-track { background: transparent; }
        .column-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        .kanban-container::-webkit-scrollbar { height: 8px; }
        .kanban-container::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

        /* Card */
        .alert-card {
            background: white;
            padding: 12px 16px;
            border-radius: var(--radius-card);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 5px solid transparent; 
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .alert-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #333;
            /* Quebra de linha inteligente para nomes longos limpos */
            word-break: break-word; 
            line-height: 1.2;
        }

        .card-metric { font-size: 0.8rem; color: #777; margin-top: 4px; }
        .metric-value { color: #333; font-weight: 500; margin-left: 4px; }

        /* Temas */
        .theme-critico .column-header { background-color: var(--bg-critical); color: var(--color-critical); }
        .theme-critico .alert-card { border-left-color: var(--color-critical); }
        .theme-critico .badge-count { color: var(--color-critical); }
        
        .theme-alto .column-header { background-color: var(--bg-high); color: var(--color-high); }
        .theme-alto .alert-card { border-left-color: var(--color-high); }
        .theme-alto .badge-count { color: var(--color-high); }

        .theme-moderado .column-header { background-color: var(--bg-moderate); color: var(--color-moderate); }
        .theme-moderado .alert-card { border-left-color: var(--color-moderate); }
        .theme-moderado .badge-count { color: var(--color-moderate); }

        .theme-baixo .column-header { background-color: var(--bg-low); color: var(--color-low); }
        .theme-baixo .alert-card { border-left-color: var(--color-low); }
        .theme-baixo .badge-count { color: var(--color-low); }

        .theme-default .column-header { background-color: var(--bg-default); color: var(--color-default); }
        .theme-default .alert-card { border-left-color: var(--color-default); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            justify-content: flex-end;
            z-index: 1000;
        }
        .modal-overlay.open { display: flex; }
        .slide-panel {
            width: 400px;
            max-width: 90%;
            background: white;
            height: 100%;
            padding: 24px;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s ease-out;
            display: flex;
            flex-direction: column;
        }
        .modal-overlay.open .slide-panel { transform: translateX(0); }
        .close-btn { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #999; float: right; }
        
        #statusMsg {
            grid-column: 1/-1;
            text-align: center;
            margin-top: 50px;
            color: #888;
            font-size: 0.9rem;
        }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>

    <div class="kanban-container" id="kanbanBoard">
        <div id="statusMsg">
            Aguardando dados...<br>
            <small id="debugText"></small>
        </div>
    </div>

    <!-- Modal Detalhes -->
    <div class="modal-overlay" id="detailsModal">
        <div class="slide-panel">
            <div style="margin-bottom:10px;"><button class="close-btn" onclick="closeModal()">&times;</button></div>
            <h2 style="margin:0; border-bottom:1px solid #eee; padding-bottom:10px; font-size:1.2rem;">Detalhes</h2>
            <div id="modalContent" style="margin-top:20px; font-size:0.9rem; line-height:1.5;"></div>
        </div>
    </div>

    <script>
        // --- 1. SAMPLE DATA ---
        const SAMPLE_DATA = {
            columns: [
                { label: "Nível do alerta", type: "string" },
                { label: "Nome da variável", type: "string" },
                { label: "qtd_alerta", type: "number" }
            ],
            data: [
                ["Alto", "NAL_DOMIN_TP_CATEGORIA_ESCOLA_PR", 264237],
                ["Alto", "NAL_DOMIN_TP_LOCALIZACAO_DIFEREN", 295608],
                ["Baixo", "NAL_COMP_IN_AGUA_REDE_PUBLICA", 268],
                ["Critico", "NAL_DOMIN_DIF_CO_MUNICIPIO", 22],
                ["Medio", "NAL_COMP_VAR_QT_EQUIP_DVD", 75]
            ]
        };

        const levelConfig = {
            'CRÍTICO': { theme: 'theme-critico', icon: '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line>' }, 
            'ALTO': { theme: 'theme-alto', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>' },
            'MODERADO': { theme: 'theme-moderado', icon: '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line>' },
            'BAIXO': { theme: 'theme-baixo', icon: '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>' },
            'DEFAULT': { theme: 'theme-default', icon: '' }
        };
        const levelsOrder = ['CRÍTICO', 'ALTO', 'MODERADO', 'BAIXO'];

        let state = { columns: [], rawData: [] };
        let isLoaded = false;

        function onDataReceived(message) {
            try {
                if (isLoaded && !message) return;
                if (!message || !message.data) throw new Error("Sem dados");

                state.columns = message.columns;
                state.rawData = message.data;
                
                const processed = processData(message.columns, message.data);
                renderDashboard(processed);
                isLoaded = true;
            } catch (err) {
                console.error(err);
                document.getElementById('statusMsg').innerHTML = `<div class="error">Erro:${err.message}</div>`;
            }
        }

        function processData(columns, rows) {
            let map = { name: -1, level: -1, volume: -1 };

            // 1. Mapeamento
            columns.forEach((col, i) => {
                const txt = col.label.toLowerCase();
                if (txt.includes('qtd') || txt.includes('volume') || txt.includes('quant')) map.volume = i; 
            });
            columns.forEach((col, i) => {
                if (i === map.volume) return;
                const txt = col.label.toLowerCase();
                if (txt.includes('nome') || txt.includes('variavel')) map.name = i;
            });
            columns.forEach((col, i) => {
                if (i === map.volume || i === map.name) return;
                const txt = col.label.toLowerCase();
                if (txt.includes('nivel') || txt.includes('alerta') || txt.includes('risco')) map.level = i;
            });

            // Default
            if (map.level === -1 && columns[0].label.includes('Nível')) map.level = 0;
            if (map.name === -1) map.name = 1;
            if (map.volume === -1) map.volume = 2;
            if (map.level === -1) map.level = 0;

            return rows.map((row, index) => {
                // Volume
                let vol = row[map.volume];
                if (vol === null || vol === undefined) vol = 0;
                else if (typeof vol === 'string') vol = parseFloat(vol.replace(/\./g, '').replace(',', '.'));
                if (isNaN(vol)) vol = 0;

                // Nível
                let rawLvl = row[map.level] ? String(row[map.level]).toUpperCase().trim() : 'OUTROS';
                if (rawLvl === 'CRITICO') rawLvl = 'CRÍTICO';
                if (rawLvl === 'MEDIO' || rawLvl === 'MÉDIO') rawLvl = 'MODERADO';

                // --- LIMPEZA DE NOME (SOLICITAÇÃO USUÁRIO) ---
                let rawName = row[map.name] || '(Sem Nome)';
                // Remove os prefixos na ordem (do mais longo para o mais curto para evitar erros)
                let cleanName = rawName.replace(/^(NAL_DOMIN_DIF_|NAL_DOMIN_|NAL_COMP_VAR_|NAL_COMP_|NAL_)/, '');

                return {
                    name: cleanName, // Nome limpo
                    fullName: rawName, // Nome original (para detalhes)
                    level: rawLvl,
                    volume: vol,
                    raw: row,
                    origIndex: index
                };
            }).filter(d => d.level !== 'NULL');
        }

        function renderDashboard(data) {
            const container = document.getElementById('kanbanBoard');
            container.innerHTML = '';

            const groups = {};
            levelsOrder.forEach(l => groups[l] = []);

            data.forEach(item => {
                if (groups[item.level]) groups[item.level].push(item);
            });

            levelsOrder.forEach(lvl => {
                const items = groups[lvl];
                items.sort((a, b) => b.volume - a.volume);
                container.appendChild(createColumn(lvl, items));
            });
        }

        function createColumn(level, items) {
            const conf = levelConfig[level] || levelConfig['DEFAULT'];
            const col = document.createElement('div');
            col.className = `kanban-column ${conf.theme}`;
            
            const iconSvg = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">${conf.icon}</svg>`;

            col.innerHTML = `
                <div class="column-header">
                    <div class="title-wrapper">${iconSvg} <span>${level}</span></div>
                    <div class="badge-count">${items.length}</div>
                </div>
                <div class="column-body">
                    ${items.length === 0 ? '<div style="text-align:center;color:#ccc;margin-top:20px;">—</div>' : ''}
                </div>
            `;

            const body = col.querySelector('.column-body');
            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'alert-card';
                card.onclick = () => openDetails(item.origIndex);
                card.innerHTML = `
                    <div class="card-title" title="${item.fullName}">${item.name}</div>
                    <div class="card-metric">Volume: <span class="metric-value">${new Intl.NumberFormat('pt-BR').format(item.volume)}</span></div>
                `;
                body.appendChild(card);
            });

            return col;
        }

        function openDetails(origIndex) {
            const itemRaw = state.rawData[origIndex];
            const processedItem = processData(state.columns, [itemRaw])[0];

            const modalContent = document.getElementById('modalContent');
            let html = `
                <p><strong>Variável (Limpa):</strong> ${processedItem.name}</p>
                <p><strong>Nome Original:</strong> <span style="color:#666">${processedItem.fullName}</span></p>
                <p><strong>Nível:</strong> ${processedItem.level}</p>
                <p><strong>Volume:</strong> ${new Intl.NumberFormat('pt-BR').format(processedItem.volume)}</p>
                <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
                <div style="background:#f9f9f9; padding:10px; border-radius:4px; color:#555;">
            `;
            state.columns.forEach((col, i) => {
                html += `<div><strong>${col.label}:</strong> ${itemRaw[i]}</div>`;
            });
            html += `</div>`;
            modalContent.innerHTML = html;
            document.getElementById('detailsModal').classList.add('open');
        }
        function closeModal() { document.getElementById('detailsModal').classList.remove('open'); }

        // Setup
        if (window.addEventListener) {
            window.addEventListener("message", function(event) {
                if (event.data && event.data.hasOwnProperty("data")) onDataReceived(event.data);
            }, false);
        }
        if (window.va && window.va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(onDataReceived);
        }

        // Trigger Fallback
        setTimeout(() => {
            if (!isLoaded) {
                console.log("Fallback acionado (Timeout).");
                onDataReceived(SAMPLE_DATA);
            }
        }, 800);

    </script>
</body>
</html>
