<!DOCTYPE html>
<!--
Adaptado para SAS Visual Analytics baseado EXATAMENTE no código KPI Card funcional.
Gráfico de barras horizontal com cores dinâmicas e limite de 15 itens.
VERSÃO MODIFICADA: Fundo transparente, margens zeradas e fonte aumentada
IMPLEMENTAÇÃO EXATA DA LÓGICA DE CÁLCULO DE CORES DINÂMICAS
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>Gráfico de Barras Horizontal para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA (EXATA ESTRUTURA DO KPI) -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: transparent; /* FUNDO TRANSPARENTE */
    }

    #chart-container {
        width: 100%;
        height: 100%;
        overflow-y: auto; /* HABILITA ROLAGEM VERTICAL */
        overflow-x: hidden;
    }

    svg {
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: transparent;
    }

    .data-bar {
        stroke: #cccccc; /* BORDA CINZA CLARO SUAVE */
        stroke-width: 0.5px; /* BORDA BEM FINA */
    }

    .data-bar:hover {
        opacity: 0.8;
        cursor: pointer;
    }

    .y-axis text {
        font-family: 'Avenir Next', sans-serif;
        font-size: 13px; /* FONTE REDUZIDA PARA 13px */
        font-weight: normal;
        fill: black;
    }

    /* REMOVENDO OS TICKS (tracinhos) DO EIXO Y */
    .y-axis .tick line {
        display: none; /* Remove os tracinhos */
    }

    .y-axis path {
        display: none; /* Remove a linha principal do eixo */
    }

    .value-label {
        font-family: 'Avenir Next', sans-serif;
        font-size: 13px; /* FONTE REDUZIDA PARA 13px */
        font-weight: 600;
        fill: #333;
    }

    .tooltip {
        position: absolute;
        background-color: rgba(0, 0, 0, 0.8);
        color: white;
        padding: 8px 13px;
        border-radius: 4px;
        font-size: 13px; /* FONTE REDUZIDA PARA 13px */
        font-weight: 500;
        font-family: 'Avenir Next', sans-serif;
        pointer-events: none;
        z-index: 1000;
        display: none;
    }
</style>

<div id="chart-container"></div>
<div id="tooltip" class="tooltip"></div>

<script>
"use strict";

function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(function() { 
            waitForD3(callback); 
        }, 100);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    waitForD3(function() {
        initializeBarChart();
    });
});

function initializeBarChart() {
    // ESTRUTURA EXATA DO KPI CARD
    const SVG_CONTAINER_ID = "chart-container";
    let VA_RESULT_NAME;
    let vaMessage;
    let processedData;
    let lastRenderTime = 0;
    const renderDelay = 250;
    let svg, mainGroup;
    const tooltip = d3.select("#tooltip");

    // DADOS DE EXEMPLO EXATOS (com valores em formato decimal para porcentagem)
    const SAMPLE_MESSAGE = {
        resultName: "barChartSample",
        rowCount: 15,
        data: [
            ["Teresina", 11.49],
            ["Macapá", 5.66],
            ["Parnaíba", 2.62],
            ["Picos", 1.75],
            ["Floriano", 1.55],
            ["Santana", 1.51],
            ["Piripiri", 1.45],
            ["Mazagão", 1.43],
            ["União", 1.41],
            ["São Paulo", 8.52],
            ["Rio de Janeiro", 7.85],
            ["Belo Horizonte", 7.23],
            ["Salvador", 6.87],
            ["Fortaleza", 6.51]
        ],
        columns: [
            { label: "Município", type: "string" },
            { label: "Porcentagem de frequência", type: "number", format: { name: "BEST", precision: 2 } }
        ]
    };

    // IMPLEMENTAÇÃO EXATA DA LÓGICA ESPECIFICADA
    function calculateDynamicColorLimits(data) {
        const values = data.map(d => d.value);
        const percentualMinimoDinamico = d3.min(values);
        const percentualMaximoDinamico = d3.max(values);
        
        const C_Intervalo_Total = percentualMaximoDinamico - percentualMinimoDinamico;
        const C_Tamanho_Faixa = C_Intervalo_Total / 15;
        
        const C_Limite_01 = percentualMinimoDinamico + C_Tamanho_Faixa;
        const C_Limite_02 = percentualMinimoDinamico + (2 * C_Tamanho_Faixa);
        const C_Limite_03 = percentualMinimoDinamico + (3 * C_Tamanho_Faixa);
        const C_Limite_04 = percentualMinimoDinamico + (4 * C_Tamanho_Faixa);
        const C_Limite_05 = percentualMinimoDinamico + (5 * C_Tamanho_Faixa);
        const C_Limite_06 = percentualMinimoDinamico + (6 * C_Tamanho_Faixa);
        const C_Limite_07 = percentualMinimoDinamico + (7 * C_Tamanho_Faixa);
        const C_Limite_08 = percentualMinimoDinamico + (8 * C_Tamanho_Faixa);
        const C_Limite_09 = percentualMinimoDinamico + (9 * C_Tamanho_Faixa);
        const C_Limite_10 = percentualMinimoDinamico + (10 * C_Tamanho_Faixa);
        const C_Limite_11 = percentualMinimoDinamico + (11 * C_Tamanho_Faixa);
        const C_Limite_12 = percentualMinimoDinamico + (12 * C_Tamanho_Faixa);
        const C_Limite_13 = percentualMinimoDinamico + (13 * C_Tamanho_Faixa);
        const C_Limite_14 = percentualMinimoDinamico + (14 * C_Tamanho_Faixa);

        return {
            C_LIMITE_01: C_Limite_01, C_LIMITE_02: C_Limite_02, C_LIMITE_03: C_Limite_03,
            C_LIMITE_04: C_Limite_04, C_LIMITE_05: C_Limite_05, C_LIMITE_06: C_Limite_06,
            C_LIMITE_07: C_Limite_07, C_LIMITE_08: C_Limite_08, C_LIMITE_09: C_Limite_09,
            C_LIMITE_10: C_Limite_10, C_LIMITE_11: C_Limite_11, C_LIMITE_12: C_Limite_12,
            C_LIMITE_13: C_Limite_13, C_LIMITE_14: C_Limite_14
        };
    }

    function getBarColor(value, limits) {
        if (value <= limits.C_LIMITE_01) return "#DE432A";
        else if (value <= limits.C_LIMITE_02) return "#E8773D";
        else if (value <= limits.C_LIMITE_03) return "#EE9E4A";
        else if (value <= limits.C_LIMITE_04) return "#F0A84D";
        else if (value <= limits.C_LIMITE_05) return "#F7D15B";
        else if (value <= limits.C_LIMITE_06) return "#F5C958";
        else if (value <= limits.C_LIMITE_07) return "#F8D95E";
        else if (value <= limits.C_LIMITE_08) return "#D9EC6B";
        else if (value <= limits.C_LIMITE_09) return "#C1E16C";
        else if (value <= limits.C_LIMITE_10) return "#CEE76C";
        else if (value <= limits.C_LIMITE_11) return "#ACDD6D";
        else if (value <= limits.C_LIMITE_12) return "#99CD6D";
        else if (value <= limits.C_LIMITE_13) return "#63B46E";
        else if (value <= limits.C_LIMITE_14) return "#4EA96F";
        else return "#329C70";
    }

    function formatPercentage(value) {
        return d3.format(".1f")(value) + "%";
    }

    function showTooltip(event, data) {
        const categoryLabel = processedData.columnLabels.category || "Categoria";
        const valueLabel = processedData.columnLabels.value || "Valor";
        const formattedValue = formatPercentage(data.value);
        
        const tooltipContent = `${categoryLabel}: ${data.category}<br/>${valueLabel}: ${formattedValue}`;
        
        tooltip
            .style("display", "block")
            .html(tooltipContent)
            .style("left", (event.pageX + 10) + "px")
            .style("top", (event.pageY - 10) + "px");
    }

    function hideTooltip() {
        tooltip.style("display", "none");
    }

    if (isInSASVA()) {
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderChart);
        }
    } else {
        handleDataReceived(SAMPLE_MESSAGE);
        window.addEventListener("resize", renderChart);
    }

    function isInSASVA() {
        try {
            return window.self !== window.top && 
                   typeof va !== 'undefined' && 
                   va.messagingUtil && 
                   va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(() => onDataReceived(messageFromVA), renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;

        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();
            return;
        }

        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        
        const chartData = allData
            .map(row => ({
                category: row[0],
                value: parseFloat(row[1]) || 0
            }))
            .sort((a, b) => b.value - a.value);

        const limits = calculateDynamicColorLimits(chartData);
        
        processedData = {
            data: chartData,
            limits: limits,
            columnLabels: {
                category: columns[0].label,
                value: columns[1].label
            }
        };

        renderChart();
    }

    // RENDERIZAÇÃO DO GRÁFICO
    function renderChart() {
        if (!processedData) {
            return;
        }

        const containerWidth = document.body.clientWidth;
        const containerHeight = document.body.clientHeight;
        
        const barHeight = 25;
        const totalBars = processedData.data.length;
        const calculatedHeight = Math.max(containerHeight, totalBars * barHeight + 40);

        d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();

        // --- CORREÇÃO: LÓGICA DA MARGEM DINÂMICA ---
        let maxLabelWidth = 0;
        
        // Cria um SVG temporário e invisível para medir os textos corretamente
        const tempSvg = d3.select("body").append("svg")
            .attr("class", "temp-svg")
            .style("position", "absolute")
            .style("visibility", "hidden")
            .style("width", "auto")
            .style("height", "auto");

        processedData.data.forEach(d => {
            // Adiciona o texto ao SVG temporário para medição
            const tempText = tempSvg.append("text")
                .attr("class", "y-axis text") // Usa a mesma classe para obter o estilo correto
                .text(d.category);
                
            // getBBox() agora funciona porque o texto está dentro de um SVG
            const currentWidth = tempText.node().getBBox().width;
            if (currentWidth > maxLabelWidth) {
                maxLabelWidth = currentWidth;
            }
        });
        
        tempSvg.remove(); // Remove o SVG temporário após a medição
        // --- FIM DA CORREÇÃO ---

        // MARGENS AJUSTADAS
        const margin = {
            top: 10,
            right: 80,
            bottom: 10,
            left: maxLabelWidth + 15 // Define a margem com base na largura máxima + um preenchimento
        };

        const chartWidth = containerWidth - margin.left - margin.right;
        const chartHeight = calculatedHeight - margin.top - margin.bottom;

        svg = d3.select("#" + SVG_CONTAINER_ID)
            .append("svg")
            .attr("width", containerWidth)
            .attr("height", calculatedHeight)
            .style("background-color", "transparent");

        mainGroup = svg.append("g")
            .attr("transform", "translate(" + margin.left + "," + margin.top + ")");

        // ESCALAS
        const xMax = d3.max(processedData.data, d => d.value) || 0;
        const xScale = d3.scaleLinear()
            .domain([0, xMax * 1.2]) 
            .range([0, chartWidth]);

        const yScale = d3.scaleBand()
            .domain(processedData.data.map(d => d.category))
            .range([0, chartHeight])
            .padding(0.4);

        // EIXO Y
        mainGroup.append("g")
            .attr("class", "y-axis axis")
            .call(d3.axisLeft(yScale));

        // BARRAS
        mainGroup.selectAll(".data-bar")
            .data(processedData.data)
            .enter()
            .append("rect")
            .attr("class", "data-bar")
            .attr("x", 0)
            .attr("y", d => yScale(d.category))
            .attr("width", d => xScale(d.value))
            .attr("height", yScale.bandwidth())
            .attr("fill", d => getBarColor(d.value, processedData.limits))
            .on("mouseenter", (event, d) => showTooltip(event, d))
            .on("mouseleave", () => hideTooltip())
            .on("mousemove", (event, d) => showTooltip(event, d));

        // RÓTULOS DE VALOR
        mainGroup.selectAll(".value-label")
            .data(processedData.data)
            .enter()
            .append("text")
            .attr("class", "value-label")
            .attr("x", d => xScale(d.value) + 8)
            .attr("y", d => yScale(d.category) + yScale.bandwidth() / 2)
            .attr("dy", "0.35em")
            .text(d => formatPercentage(d.value));
    }
}
</script>
</body>
</html>
