<!DOCTYPE html>
<!--
KPI Card Simplificado para SAS Visual Analytics - Variação em Pontos Percentuais
Recebe: Título, Ano, Medida (em percentual) e opcionalmente um valor real para o tooltip.
Calcula automaticamente as variações em p.p.
Estilo alinhado com o card de variação percentual.
-->
<html>
<head>
    <meta charset="UTF-8">
    <title>KPI Card Pontos Percentuais para SAS VA</title>
    <!-- Import D3.js -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <!-- Importar utilitários do SAS VA -->
    <script type="text/javascript">
        if (typeof window !== 'undefined' && window.self !== window.top) {
            try {
                document.write('<script type="text/javascript" src="../../util/messagingUtil.js"><\/script>');
                document.write('<script type="text/javascript" src="../../util/contentUtil.js"><\/script>');
            } catch(e) {
                console.log("Utilitários do SAS VA não disponíveis");
            }
        }
    </script>
</head>
<body>
<style type="text/css">
    html, body, svg {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: 'Avenir Next', 'Avenir', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background-color: #f5f5f5;
    }

    .title-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .main-label-text {
        fill: #2d5016;
        font-weight: 600;
    }

    .main-value-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-shadow: 0px 2px 4px rgba(0,0,0,0.15);
    }

    .secondary-label-text {
        fill: #2d5016;
        font-weight: 600;
        text-anchor: middle;
    }

    .secondary-value-text {
        fill: #1a4f0e;
        font-weight: 700;
        text-anchor: middle;
        text-shadow: 0px 1px 2px rgba(0,0,0,0.1);
    }

    .tooltip {
        position: absolute;
        background-color: rgba(26, 79, 14, 0.95);
        color: white;
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 11px;
        font-weight: 600;
        pointer-events: none;
        z-index: 1000;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        border: 1px solid rgba(255,255,255,0.2);
        display: none;
        line-height: 1.3;
    }

    .tooltip::after {
        content: '';
        position: absolute;
        top: 100%;
        left: 50%;
        margin-left: -4px;
        border: 4px solid transparent;
        border-top-color: rgba(26, 79, 14, 0.95);
    }
</style>

<div id="chart-container"></div>
<!-- Tooltip element -->
<div id="tooltip" class="tooltip"></div>

<script>
"use strict";

function waitForD3(callback) {
    if (typeof d3 !== 'undefined') {
        callback();
    } else {
        setTimeout(function() { waitForD3(callback); }, 100);
    }
}

document.addEventListener("DOMContentLoaded", function() {
    waitForD3(initializeKPICard);
});

function initializeKPICard() {
    /*******************************************************
     * DECLARAÇÃO DE VARIÁVEIS
     *******************************************************/
    const SVG_CONTAINER_ID = "chart-container";
    let VA_RESULT_NAME;
    let vaMessage;
    let processedData;
    let lastRenderTime = 0;
    const renderDelay = 250;
    let svg, mainGroup;
    const tooltip = d3.select("#tooltip");

    /*******************************************************
     * FUNÇÕES DE FORMATAÇÃO
     *******************************************************/
    
    // Define o locale para Português (Brasil)
    d3.formatDefaultLocale({
      "decimal": ",",
      "thousands": ".",
      "grouping": [3],
      "currency": ["R$", " "]
    });

    /*******************************************************
     * FUNÇÕES DO TOOLTIP
     *******************************************************/
    function showTooltip(event, data) {
        const valueLabel = processedData.columnLabels.value || "Percentual";
        const realValueLabel = processedData.columnLabels.realValue;

        const formattedPercent = d3.format(".1f")(data.value) + "%";

        let tooltipContent = `<b>${data.period}</b><br/>` + 
                               `${valueLabel}: ${formattedPercent}`;

        if (realValueLabel && data.realValue !== null) {
            const formattedReal = d3.format(",.0f")(data.realValue);
            tooltipContent += `<br/>${realValueLabel}: ${formattedReal}`;
        }
        
        tooltip
            .style("display", "block")
            .html(tooltipContent)
            .style("left", (event.pageX - tooltip.node().offsetWidth / 2) + "px")
            .style("top", (event.pageY - tooltip.node().offsetHeight - 8) + "px");
    }

    function hideTooltip() {
        tooltip.style("display", "none");
    }

    /*******************************************************
     * CONFIGURAÇÃO PARA DEBUG FORA DO SAS VA
     *******************************************************/
    const SAMPLE_MESSAGE = {
        resultName: "kpiCardSimpleSample",
        data: [
            ["Taxa de Acesso à Internet", 2020, 78.5, 5800],
            ["Taxa de Acesso à Internet", 2021, 81.2, 6100],
            ["Taxa de Acesso à Internet", 2022, 84.1, 6229],
            ["Taxa de Acesso à Internet", 2023, 87.3, 6500],
            ["Taxa de Acesso à Internet", 2024, 85.8, 6400],
        ],
        columns: [
            { label: "Métrica", type: "string" },
            { label: "Ano", type: "number" },
            { label: "Percentual", type: "number" },
            { label: "Total de Docentes", type: "number" } // Nova coluna para o valor real
        ]
    };

    /*******************************************************
     * FUNÇÕES DE CALLBACK DO SAS VA
     *******************************************************/
    if (isInSASVA()) {
        if (typeof va !== 'undefined' && va.messagingUtil) {
            va.messagingUtil.setOnDataReceivedCallback(handleDataReceived);
        }
        if (typeof va !== 'undefined' && va.contentUtil) {
            va.contentUtil.setupResizeListener(renderCard);
        }
    } else {
        // Para teste
        handleDataReceived(SAMPLE_MESSAGE);
        window.addEventListener("resize", renderCard);
    }

    function isInSASVA() {
        try {
            return window.self !== window.top && typeof va !== 'undefined' && va.messagingUtil && va.contentUtil;
        } catch (e) {
            return false;
        }
    }

    function handleDataReceived(messageFromVA) {
        const now = Date.now();
        if (now - lastRenderTime < renderDelay) {
            setTimeout(() => onDataReceived(messageFromVA), renderDelay);
        } else {
            onDataReceived(messageFromVA);
        }
        lastRenderTime = now;
    }

    /*******************************************************
     * FUNÇÃO DE PROCESSAMENTO DE DADOS
     *******************************************************/
    function onDataReceived(messageFromVA) {
        vaMessage = messageFromVA;
        VA_RESULT_NAME = messageFromVA.resultName;
        
        if (!messageFromVA.data || messageFromVA.data.length === 0) {
            processedData = null;
            d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();
            return;
        }

        const columns = messageFromVA.columns;
        const allData = messageFromVA.data;
        const titulo = allData[0][0];
        const hasRealValueColumn = columns.length > 3;

        // Agrupa e ordena os dados por período
        const aggregatedByPeriod = d3.group(allData, d => d[1]);
        
        const calculatedData = Array.from(aggregatedByPeriod, ([period, values]) => {
            const totalValue = d3.sum(values, d => d[2]);
            const totalRealValue = hasRealValueColumn ? d3.sum(values, d => d[3]) : null;
            return {
                periodo: +period,
                value: totalValue,
                realValue: totalRealValue
            };
        }).sort((a, b) => a.periodo - b.periodo);
        
        // Cálculo das variações em pontos percentuais
        const values = calculatedData.map(d => d.value);
        const ultimoValor = values[values.length - 1];
        const primeiroValor = values[0];
        const penultimoValor = values.length > 1 ? values[values.length - 2] : null;

        const variacaoPeriodo = ultimoValor - primeiroValor;
        const variacaoAnterior = penultimoValor !== null ? ultimoValor - penultimoValor : 0;

        let mediaAnual = 0;
        if (values.length > 1) {
            const variacoesAnuais = [];
            for (let i = 1; i < values.length; i++) {
                variacoesAnuais.push(values[i] - values[i-1]);
            }
            mediaAnual = d3.mean(variacoesAnuais) || 0;
        }

        const formatPontoPercentual = (val) => d3.format("+.1f")(val) + " p.p.";

        processedData = {
            titulo: titulo,
            columnLabels: {
                period: columns[1].label,
                value: columns[2].label,
                realValue: hasRealValueColumn ? columns[3].label : null
            },
            valorPrincipal: {
                label: "Variação no Período",
                value: variacaoPeriodo,
                format: formatPontoPercentual
            },
            valorSecundario: {
                label: "Variação vs Ano Anterior",
                value: variacaoAnterior,
                format: formatPontoPercentual
            },
            valorTerciario: {
                label: "Média Anual",
                value: mediaAnual,
                format: formatPontoPercentual
            },
            serieTemporal: {
                dados: calculatedData,
                label: columns[2].label
            }
        };

        renderCard();
    }

    /*******************************************************
     * FUNÇÃO PRINCIPAL DE RENDERIZAÇÃO - OTIMIZADA PARA 520x200
     *******************************************************/
    function renderCard() {
        if (!processedData) return;
        
        const width = document.body.clientWidth;
        const height = document.body.clientHeight;
        
        const isCompactFormat = width <= 600 && height <= 250;
        
        d3.select("#" + SVG_CONTAINER_ID).selectAll("*").remove();

        svg = d3.select("#" + SVG_CONTAINER_ID).append("svg").attr("width", width).attr("height", height);
        
        const defs = svg.append("defs");
        const gradient = defs.append("linearGradient").attr("id", "cardGradient").attr("x1", "0%").attr("y1", "0%").attr("x2", "100%").attr("y2", "100%");
        gradient.append("stop").attr("offset", "0%").attr("stop-color", "#ffffff");
        gradient.append("stop").attr("offset", "100%").attr("stop-color", "#4CAF50");

        svg.append("rect").attr("width", width).attr("height", height).attr("rx", 6).attr("fill", "url(#cardGradient)").attr("stroke", "#d0d0d0").attr("stroke-width", 1);

        mainGroup = svg.append("g");
        
        const padding = isCompactFormat ? Math.max(width * 0.012, 6) : Math.max(width * 0.015, 8);
        const contentWidth = width - (padding * 2);
        
        let titleFontSize, labelFontSize, valueFontSize, titleHeight;
        
        if (isCompactFormat) {
            titleFontSize = Math.min(Math.max(height * 0.08, 11), 14);
            labelFontSize = Math.min(Math.max(height * 0.09, 10), 13);
            valueFontSize = Math.min(Math.max(height * 0.14, 14), 18);
            titleHeight = Math.max(height * 0.12, 18);
        } else {
            titleFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.045, 24);
            labelFontSize = Math.min(Math.max(height * 0.07, 16), width * 0.04, 24);
            valueFontSize = Math.min(Math.max(height * 0.09, 20), width * 0.05, 30);
            titleHeight = Math.max(height * 0.12, 45);
        }

        const contentSectionHeight = height - titleHeight - padding;
        
        let chartWidthRatio = isCompactFormat ? 0.58 : 0.7;
        
        const chartWidth = Math.max(contentWidth * chartWidthRatio, isCompactFormat ? 140 : 180);
        const variationsWidth = contentWidth - chartWidth - padding;

        mainGroup.append("text")
            .attr("class", "title-text")
            .attr("x", width / 2)
            .attr("y", padding + titleFontSize * 0.8)
            .attr("font-size", titleFontSize + "px")
            .text(processedData.titulo);

        const chartY = titleHeight;
        const chartGroup = mainGroup.append("g").attr("transform", `translate(${padding}, ${chartY})`);
        
        const { dados } = processedData.serieTemporal;
        const values = dados.map(d => d.value);
        
        if (values.length > 0) {
            const minVal = d3.min(values);
            const maxVal = d3.max(values);
            const range = maxVal - minVal || 1;
            
            const innerChartPadding = isCompactFormat ? Math.max(chartWidth * 0.025, 5) : Math.max(chartWidth * 0.04, 10);
            const innerWidth = chartWidth - (innerChartPadding * 2);
            const chartHeight = isCompactFormat ? Math.max(contentSectionHeight * 0.85, 85) : Math.max(contentSectionHeight * 0.75, 80);
            const innerHeight = chartHeight - (innerChartPadding * 2);
            
            const lineData = dados.map((d, i) => {
                const x = innerChartPadding + (innerWidth / Math.max(dados.length - 1, 1)) * i;
                const normalizedY = range > 0 ? (d.value - minVal) / range : 0.5;
                return { 
                    x, 
                    y: innerChartPadding + innerHeight * (1 - normalizedY), 
                    value: d.value,
                    period: d.periodo,
                    realValue: d.realValue
                };
            });

            const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveMonotoneX);
            const strokeWidth = isCompactFormat ? Math.min(Math.max(height * 0.015, 1.5), 3) : Math.min(Math.max(width * 0.008, 3), 8);

            chartGroup.append("path")
                .datum(lineData)
                .attr("d", line)
                .attr("stroke", "#1A9850")
                .attr("stroke-width", strokeWidth)
                .attr("fill", "none")
                .attr("stroke-linecap", "round");

            const pointRadius = isCompactFormat ? Math.min(Math.max(height * 0.012, 2), 3.5) : Math.min(Math.max(width * 0.005, 3), 7);
            
            chartGroup.selectAll(".data-point")
                .data(lineData)
                .enter()
                .append("circle")
                .attr("class", "data-point")
                .attr("cx", d => d.x)
                .attr("cy", d => d.y)
                .attr("r", pointRadius)
                .attr("fill", "#1A9850")
                .attr("stroke", "#ffffff")
                .attr("stroke-width", Math.max(pointRadius * 0.3, 1))
                .style("cursor", "pointer")
                .on("mouseenter", function(event, d) {
                    d3.select(this).transition().duration(150).attr("r", pointRadius * 1.3);
                    showTooltip(event, d);
                })
                .on("mouseleave", function() {
                    d3.select(this).transition().duration(150).attr("r", pointRadius);
                    hideTooltip();
                })
                .on("mousemove", showTooltip);

            const yearLabelFontSize = isCompactFormat ? Math.min(Math.max(height * 0.065, 8), 11) : Math.min(Math.max(height * 0.04, 10), width * 0.025, 15);
            
            chartGroup.selectAll(".year-label")
                .data(lineData)
                .enter()
                .append("text")
                .attr("class", "year-label")
                .attr("x", d => d.x)
                .attr("y", chartHeight + Math.max(12, height * 0.018))
                .attr("font-size", yearLabelFontSize + "px")
                .attr("fill", "#2d5016")
                .attr("text-anchor", "middle")
                .attr("font-weight", "600")
                .text(d => d.period);
        }

        const separatorX = padding + chartWidth + (padding / 2);
        mainGroup.append("line")
            .attr("x1", separatorX)
            .attr("y1", chartY)
            .attr("x2", separatorX)
            .attr("y2", chartY + contentSectionHeight)
            .attr("stroke", "rgba(45,80,22,0.3)")
            .attr("stroke-width", 1);

        const variationsX = separatorX + (padding / 2);
        const variationsGroup = mainGroup.append("g").attr("transform", `translate(${variationsX}, ${chartY})`);
        
        const availableVariationsHeight = contentSectionHeight * 0.95;
        const variationBlockHeight = availableVariationsHeight / 3;
        const variationStartY = contentSectionHeight * 0.03;
        const labelValueSpacing = isCompactFormat ? Math.max(variationBlockHeight * 0.45, 12) : Math.max(variationBlockHeight * 0.35, 20);
        const variationCenterX = variationsWidth / 2;

        const variations = [
            processedData.valorPrincipal, 
            processedData.valorSecundario, 
            processedData.valorTerciario
        ];
        
        variations.forEach((variation, i) => {
            const yPos = variationStartY + (i * variationBlockHeight);
            
            variationsGroup.append("text")
                .attr("class", "secondary-label-text")
                .attr("x", variationCenterX)
                .attr("y", yPos)
                .attr("font-size", labelFontSize + "px")
                .text(variation.label);
                
            variationsGroup.append("text")
                .attr("class", "secondary-value-text")
                .attr("x", variationCenterX)
                .attr("y", yPos + labelValueSpacing)
                .attr("font-size", valueFontSize + "px")
                .text(variation.format(variation.value));
        });
    }
}
</script>
</body>
</html>
